<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Divine Client — High-Performance Minecraft Platform &amp; Dedicated Hosting Engine{% endblock %}</title>
<meta name="description" content="{% block description %}{{ description or 'Divine Client is a high-performance Minecraft launcher and dedicated multiplayer hosting engine with built-in QoL mods and cloaks.' }}{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Divine Client">
<meta property="og:title" content="{% block og_title %}{{ og_title or 'Divine Client — Ultra-Fast Minecraft Launcher & Dedicated Engine' }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ og_description or 'Ultra-fast Minecraft launcher with isolated instances, built-in QoL mods, one-click dedicated Paper/Fabric servers, and Discord RPC.' }}{% endblock %}">
<meta property="og:url" content="{{ base }}{{ request.path if request else '/' }}">
<link rel="canonical" href="{{ base }}{{ request.path if request else '/' }}">
<meta property="og:image" content="{{ base }}/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07090f">
<link rel="icon" href="/static/emblem.png">

<style>
  :root {
    --bg-base: #07090f;
    --bg-surface: #0e121e;
    --bg-card: rgba(18, 24, 38, 0.85);
    --bg-card-hover: rgba(28, 36, 56, 0.95);
    --bg-input: #0a0d16;
    --border: rgba(255, 255, 255, 0.12);
    --border-hover: rgba(255, 255, 255, 0.28);
    --border-accent: #10b981;
    --text-main: #f9fafb;
    --text-muted: #94a3b8;
    --text-faint: #64748b;
    --accent: #10b981;
    --accent-hover: #059669;
    --accent-light: #34d399;
    --accent-cyan: #38bdf8;
    --accent-gold: #f59e0b;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* Dynamic Ambient Background Canvas */
  #ambient-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.65;
  }

  .content-layer {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a { color: var(--accent-light); text-decoration: none; transition: all 0.2s ease; }
  a:hover { color: #ffffff; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
  
  .wrap { max-width: 1160px; width: 100%; margin: 0 auto; padding: 0 24px; }
  
  /* Navbar */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(7, 9, 15, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  nav .wrap {
    display: flex;
    align-items: center;
    height: 70px;
    gap: 24px;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: 0.5px;
    color: #ffffff;
    text-decoration: none;
  }
  .nav-brand-icon {
    width: 32px;
    height: 32px;
    object-fit: contain;
    animation: divineSpin 25s linear infinite;
  }
  @keyframes divineSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .nav-links {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-links a {
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
  }
  .nav-links a:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
  }
  .btn-nav-download {
    background: #ffffff !important;
    color: #090d16 !important;
    font-weight: 900 !important;
    padding: 8px 18px !important;
    border-radius: var(--radius-sm) !important;
    box-shadow: 0 0 16px rgba(255,255,255,0.25);
  }
  .btn-nav-download:hover {
    background: #e2e8f0 !important;
    box-shadow: 0 0 24px rgba(255,255,255,0.45);
    color: #000000 !important;
  }

  /* Main Container */
  main { flex: 1; padding: 40px 0 60px; }

  /* Hero Section */
  .hero {
    padding: 56px 0 40px;
    text-align: center;
    position: relative;
  }
  .badge-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 6px 14px;
    border-radius: 20px;
    text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .hero h1, .hero h2 {
    font-size: 46px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.8px;
    margin: 20px 0;
    color: #ffffff;
    text-shadow: 0 0 30px rgba(255,255,255,0.15);
  }
  .hero p.lead {
    font-size: 16.5px;
    color: var(--text-muted);
    line-height: 1.65;
    max-width: 720px;
    margin: 0 auto 32px;
  }
  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #ffffff;
    color: #090d16;
    font-weight: 900;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    border: 1px solid #ffffff;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .btn:hover {
    background: #e2e8f0;
    border-color: #e2e8f0;
    color: #000000;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(255,255,255,0.25);
  }
  .btn.btn-secondary {
    background: rgba(255, 255, 255, 0.06);
    border-color: var(--border);
    color: #ffffff;
  }
  .btn.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--border-hover);
    color: #ffffff;
  }
  .btn.btn-discord {
    background: #5865F2;
    border-color: #5865F2;
    color: #ffffff;
  }
  .btn.btn-discord:hover {
    background: #4752c4;
    border-color: #4752c4;
    box-shadow: 0 6px 20px rgba(88, 101, 242, 0.35);
  }

  /* Cards and Grids */
  .grid {
    display: grid;
    gap: 18px;
    margin: 28px 0;
  }
  .grid.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .grid.three { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .grid.four { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

  .card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 24px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  }
  .card-title {
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 8px;
  }
  .card-desc {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* Section Headers */
  .section-header {
    margin: 56px 0 20px;
    text-align: center;
  }
  .section-title {
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.3px;
  }
  .section-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Live Stats Row */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin: 40px 0;
    padding: 20px;
    background: rgba(14, 18, 30, 0.7);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    text-align: center;
  }
  .stat-item .stat-num {
    font-size: 28px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.5px;
  }
  .stat-item .stat-lbl {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    background: #05070c;
    padding: 40px 0 30px;
    font-size: 13px;
    color: var(--text-faint);
  }
  footer .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }
  footer .footer-links {
    display: flex;
    gap: 20px;
  }
  footer .footer-links a {
    color: var(--text-muted);
    font-weight: 600;
  }
  footer .footer-links a:hover {
    color: #ffffff;
  }
</style>
</head>
<body>

<!-- Dynamic Starfield Ambient Canvas -->
<canvas id="ambient-canvas"></canvas>

<div class="content-layer">
  <nav>
    <div class="wrap">
      <a href="/" class="nav-brand">
        <img src="/static/emblem.png" class="nav-brand-icon" alt="Divine Emblem">
        <span>DIVINE CLIENT</span>
      </a>
      <div class="nav-links">
        <a href="/">Overview</a>
        <a href="/#features">Features</a>
        <a href="/shop">Store</a>
        <a href="/terms">Terms</a>
        <a href="/privacy">Privacy</a>
        <a href="/link">Link Discord</a>
        <a href="{{ invite }}" target="_blank" rel="noopener">Discord</a>
        <a href="/download" class="btn-nav-download">Download</a>
      </div>
    </div>
  </nav>

  <main>
    <div class="wrap">
      {% block body %}{% endblock %}
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div style="display: flex; align-items: center; gap: 10px;">
        <img src="/static/emblem.png" style="width: 20px; height: 20px;" alt="">
        <div>&copy; 2026 Divine Client. High-Performance Minecraft Platform &amp; Dedicated Hosting Engine.</div>
      </div>
      <div class="footer-links">
        <a href="/terms">Terms of Service</a>
        <a href="/privacy">Privacy Policy</a>
        <a href="/link">Discord Gateway</a>
        <a href="{{ invite }}" target="_blank" rel="noopener">Community</a>
        <a href="/download">Download</a>
      </div>
    </div>
  </footer>
</div>

<script>
  // Dynamic Ambient Panorama Canvas
  (function() {
    const canvas = document.getElementById("ambient-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w, h;
    const stars = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.8 + 0.2,
        speed: Math.random() * 0.25 + 0.05
      });
    }

    function animate() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      for (const s of stars) {
        s.y -= s.speed;
        if (s.y < 0) {
          s.y = h;
          s.x = Math.random() * w;
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }
    animate();
  })();
</script>

</body>
</html>
