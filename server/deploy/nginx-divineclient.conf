# HTTPS in front of the Divine web app.
#
#   sudo cp server/deploy/nginx-divineclient.conf /etc/nginx/sites-available/divineclient
#   sudo ln -s /etc/nginx/sites-available/divineclient /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d divineclient.wispbyte.org      # writes the 443 bits
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app itself then only needs to listen on localhost (divine-web.service:
# -b 127.0.0.1:10230), and PUBLIC_BASE_URL stays https://divineclient.wispbyte.org -
# the two X-Forwarded-* lines are what let the app agree with the browser about its
# own address, which matters because the site 301s its old host names.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name divineclient.wispbyte.org;

    # certbot serves the ACME challenge from /var/www/certbot
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name divineclient.wispbyte.org;

    # certbot --nginx replaces these two paths with its own; without certbot, put
    # your certificate here.
    ssl_certificate     /etc/letsencrypt/live/divineclient.wispbyte.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/divineclient.wispbyte.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # the landing page ships 1.2 MB of promo art - let nginx compress and cache it
    gzip on;
    gzip_types image/svg+xml text/css application/javascript;

    client_max_body_size 1m;          # nothing here uploads much; keeps bots honest

    location / {
        proxy_pass http://127.0.0.1:10230;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
